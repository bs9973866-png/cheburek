name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "README.md"
      - "tests/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check and unit tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Download and verify sing-box core
        shell: pwsh
        run: |
          $downloadUrl = "https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-windows-amd64.zip"
          $expected = "d8b86ef58936dba9230ec6a57ffa4243933f3c14ef4809828b6c553440ed1518"
          $zipPath = Join-Path $env:RUNNER_TEMP "sing-box.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "sing-box-extracted"
          Invoke-WebRequest -Uri $downloadUrl -Headers @{ "User-Agent" = "CheburekAccess-Builder" } -OutFile $zipPath
          $actual = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "sing-box archive SHA-256 verification failed." }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force
          $core = Get-ChildItem -Path $extractDir -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          if ($null -eq $core) { throw "sing-box.exe was not found in the official archive." }
          Copy-Item -Path $core.FullName -Destination (Join-Path $env:GITHUB_WORKSPACE "sing-box.exe") -Force

      - name: Build self-contained executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name CheburekAccess --add-binary "sing-box.exe;." app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CheburekAccess-Windows-x64
          path: dist/CheburekAccess.exe
          if-no-files-found: error
